<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お店の詳細 - くすぐりフェチ専科</title>
  <meta id="meta-description" name="description" content="くすぐりフェチ専科に掲載している店舗の詳細情報と体験レビューです。">
  <meta id="meta-robots" name="robots" content="index, follow">
  <link id="canonical-url" rel="canonical">
  <meta id="og-title" property="og:title" content="お店の詳細 | くすぐりフェチ専科">
  <meta id="og-description" property="og:description" content="くすぐりフェチ専科に掲載している店舗の詳細情報と体験レビューです。">
  <meta property="og:type" content="article">
  <meta id="og-url" property="og:url" content="https://maru-tk-dev.github.io/tickle_brothel/shop-detail.html">
  <meta property="og:image" content="https://maru-tk-dev.github.io/tickle_brothel/images/og.png">
  <meta property="og:image:width" content="1729">
  <meta property="og:image:height" content="910">
  <meta name="twitter:card" content="summary_large_image">
  <meta id="twitter-title" name="twitter:title" content="お店の詳細 | くすぐりフェチ専科">
  <meta id="twitter-description" name="twitter:description" content="くすぐりフェチ専科に掲載している店舗の詳細情報と体験レビューです。">
  <meta name="twitter:image" content="https://maru-tk-dev.github.io/tickle_brothel/images/og.png">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <header>
    <h1><a href="index.html">くすぐりフェチ専科</a></h1>
    <!-- Breadcrumb or back link can be added here if desired -->
  </header>

  <main>
    <section id="shop-detail-container">
      <!-- Shop details will be populated here by JavaScript -->
      <h2 id="shop-name">お店の情報を読み込み中...</h2>
      <img id="shop-image" src="images/shop_placeholder.png" alt="お店の画像" style="width:100%;max-width:400px;">
      <p id="shop-description"></p>
      <p id="shop-address"></p>
      <div id="shop-tags" class="tags"></div>
      <p id="shop-website"></p>
    </section>

    <section id="shop-individuals-container">
      <h2>所属している女の子</h2>
      <div id="individuals-list">
        <!-- Individuals associated with the shop will be populated here by JavaScript -->
        <p>女の子の情報を読み込み中...</p>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 くすぐりフェチ専科. All rights reserved.</p>
  </footer>

  <script>
    window.allShopsData = {{ site.data.shops | jsonify }};
    window.allIndividualsData = {{ site.data.individuals | jsonify }};
  </script>
  <script src="js/shop-detail.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      if (!id) return;

      const shop = window.allShopsData.find(s => s.id === id);
      if (!shop) return;

      const data = {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": shop.name,
        "description": shop.description,
        "url": window.location.href,
        "address": {
          "@type": "PostalAddress",
          "addressLocality": shop.address_general,
          "addressCountry": "JP"
        }
      };
      if (shop.website_url) data.sameAs = shop.website_url;
      if (shop.image_url) data.image = new URL(shop.image_url, document.baseURI).href;

      const script = document.createElement('script');
      script.type = 'application/ld+json';
      script.textContent = JSON.stringify(data);
      document.head.appendChild(script);
    });
  </script>
</body>

</html>
